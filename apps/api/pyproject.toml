[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-demo"
version = "0.1.0"
description = "Local LangGraph demo with isolated baseline and optional protected modes"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.4",
    "fastapi==0.147.0",
    "uvicorn==0.54.0",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "langsmith==0.14.11",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
guard = ["agentguard==0.6.0"]
